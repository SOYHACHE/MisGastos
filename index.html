<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Gastos Familiares</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb86fc">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --input-bg: #2c2c2c;
            --border-color: #333;
            --green-accent: #03dac6;
            --red-cancel: #cf6679;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 450px;
            background-color: var(--card-bg);
            padding: 20px; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { text-align: center; color: var(--accent-color); font-weight: 300; }

        select, input[type="number"], input[type="text"] {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white; border-radius: 8px; outline: none; padding: 10px;
        }

        .mes-selector { width: 100%; margin-bottom: 20px; font-size: 1rem; }

        .section-title {
            font-size: 0.85rem; text-transform: uppercase; color: #888;
            margin: 20px 0 10px 0; border-bottom: 1px solid var(--border-color);
        }

        .input-group {
            display: flex; align-items: center; margin-bottom: 10px;
            background: #252525; padding: 8px 12px; border-radius: 12px;
        }

        .input-group i { width: 25px; color: var(--accent-color); margin-right: 10px; text-align: center; }
        label { flex: 1; font-size: 0.9rem; }

        .currency-input {
            position: relative;
            display: flex;
            align-items: center;
        }

        .currency-input span {
            position: absolute;
            left: 10px;
            color: var(--green-accent);
            font-weight: bold;
            pointer-events: none;
        }

        .currency-input input {
            width: 100px;
            text-align: right;
            padding-left: 20px;
        }

        .button-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }

        button {
            padding: 12px 5px; border-radius: 10px; border: none; cursor: pointer;
            font-weight: bold; font-size: 0.8rem;
        }

        .btn-save { background: var(--green-accent); color: #000; }
        .btn-history { background: var(--accent-color); color: #000; }
        .btn-print { background: #03a9f4; color: #fff; }
        .btn-add { width: 100%; background: transparent; color: var(--green-accent); border: 1px dashed; margin-top: 10px; }

        .total-container {
            margin-top: 20px; padding: 15px; background: #252525;
            border-radius: 15px; text-align: center; border: 1px solid var(--accent-color);
        }

        #resultado { font-size: 1.8rem; font-weight: bold; color: var(--green-accent); }

        .modal {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.9);
            overflow-y: auto; padding: 20px 0;
        }

        .modal-content {
            background-color: #f5f5f5; color: black; margin: auto;
            padding: 30px; width: 90%; max-width: 550px; border-radius: 10px;
        }

        .recibo-card {
            background: white; border: 2px solid #000; padding: 20px;
            margin-bottom: 30px; position: relative;
        }

        .delete-recibo {
            position: absolute; top: 10px; right: 10px; color: var(--red-cancel);
            font-size: 1.5rem; cursor: pointer;
        }

        .recibo-header { text-align: center; border-bottom: 2px solid #000; margin-bottom: 15px; }
        .recibo-table { width: 100%; border-collapse: collapse; }
        .recibo-table td { padding: 8px 0; border-bottom: 1px solid #ddd; }
        .item-total { font-weight: bold; border-top: 2px solid #000 !important; font-size: 1.2rem; }

        @media print {
            body * { visibility: hidden; }
            .modal, .modal * { visibility: visible; }
            .modal { position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .delete-recibo, .close-btn-ui { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <select id="mes" class="mes-selector">
        <option>Enero</option><option>Febrero</option><option>Marzo</option>
        <option>Abril</option><option selected>Mayo</option><option>Junio</option>
        <option>Julio</option><option>Agosto</option><option>Septiembre</option>
        <option>Octubre</option><option>Noviembre</option><option>Diciembre</option>
    </select>

    <h2>GASTOS MENSUALES</h2>

    <div class="section-title">Vivienda y Servicios</div>
    <div class="input-group"><i class="fa-solid fa-house"></i><label>Alquiler</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Alquiler" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-building"></i><label>Expensas</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Expensas" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-lightbulb"></i><label>Luz</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Luz" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-faucet"></i><label>Agua</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Agua" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-fire"></i><label>Gas</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Gas" placeholder="0" oninput="calcularTotal()"></div></div>

    <div class="section-title">Hijos y Transporte</div>
    <div class="input-group"><i class="fa-solid fa-bus"></i><label>Micro Hijo</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Micro Hijo" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-bus"></i><label>Micro Hija</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Micro Hija" placeholder="0" oninput="calcularTotal()"></div></div>

    <div class="section-title">Comunicaciones y Seguro</div>
    <div class="input-group"><i class="fa-solid fa-mobile-screen-button"></i><label>Teléfonos</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Teléfonos" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-wifi"></i><label>Internet</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Internet" placeholder="0" oninput="calcularTotal()"></div></div>
    <div class="input-group"><i class="fa-solid fa-car-on"></i><label>Seguro Auto</label><div class="currency-input"><span>$</span><input type="number" class="gasto" data-name="Seguro Auto" placeholder="0" oninput="calcularTotal()"></div></div>

    <div id="extra-items"></div>
    <button class="btn-add" onclick="agregarItem()">+ Agregar Ítem Extra</button>

    <div class="total-container">
        <h3>TOTAL ESTIMADO</h3>
        <span id="resultado">$ 0</span>
    </div>

    <div class="button-grid">
        <button class="btn-save" onclick="guardarGastos()"><i class="fa-solid fa-floppy-disk"></i> GUARDAR</button>
        <button class="btn-history" onclick="mostrarHistorial()"><i class="fa-solid fa-list-check"></i> HISTORIAL</button>
        <button class="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> IMPRIMIR</button>
    </div>
</div>

<div id="modalHistorial" class="modal">
    <div class="modal-content">
        <button class="close-btn-ui" onclick="cerrarHistorial()" style="background:var(--red-cancel); color:white; width:100%; margin-bottom:20px; border-radius:8px; padding:10px; font-weight:bold;">CERRAR HISTORIAL</button>
        <div id="listaRecibos"></div>
    </div>
</div>

<script>
    // Registro de PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA lista'))
                .catch(err => console.log('Error PWA', err));
        });
    }

    function agregarItem() {
        const container = document.getElementById('extra-items');
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <i class="fa-solid fa-plus"></i>
            <input type="text" class="nombre-extra" placeholder="Otro..." style="flex:1; margin-right:5px; background:transparent; border:none; border-bottom:1px dashed #555; color:white">
            <div class="currency-input">
                <span>$</span>
                <input type="number" class="gasto" placeholder="0" oninput="calcularTotal()">
            </div>
            <i class="fa-solid fa-trash-can" style="margin-left:10px; color:var(--red-cancel); cursor:pointer" onclick="this.parentElement.remove(); calcularTotal()"></i>`;
        container.appendChild(div);
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll('.gasto').forEach(i => {
            let val = parseFloat(i.value);
            if (!isNaN(val)) total += val;
        });
        document.getElementById('resultado').innerText = '$ ' + total.toLocaleString('es-AR');
        return total;
    }

    function guardarGastos() {
        const mes = document.getElementById('mes').value;
        const items = [];
        document.querySelectorAll('.input-group').forEach(group => {
            const inputField = group.querySelector('.gasto');
            const val = parseFloat(inputField.value);
            if (val > 0) {
                const nombre = group.querySelector('label')?.innerText || group.querySelector('.nombre-extra')?.value || "Extra";
                items.push({ nombre, monto: val });
            }
        });

        if (items.length === 0) return alert("Ingresa al menos un monto.");

        const historial = JSON.parse(localStorage.getItem('historial_completo') || '[]');
        historial.unshift({ id: Date.now(), mes, fecha: new Date().toLocaleDateString(), items, total: calcularTotal() });
        localStorage.setItem('historial_completo', JSON.stringify(historial));
        alert("¡Recibo guardado!");
    }

    function mostrarHistorial() {
        const historial = JSON.parse(localStorage.getItem('historial_completo') || '[]');
        const lista = document.getElementById('listaRecibos');
        lista.innerHTML = historial.length === 0 ? "<p style='text-align:center'>No hay gastos guardados.</p>" : "";

        historial.forEach(rec => {
            let filas = rec.items.map(it => `<tr><td>${it.nombre}</td><td style="text-align:right">$ ${it.monto.toLocaleString('es-AR')}</td></tr>`).join('');
            lista.innerHTML += `
                <div class="recibo-card" id="rec-${rec.id}">
                    <i class="fa-solid fa-circle-xmark delete-recibo" onclick="borrarRegistro(${rec.id})"></i>
                    <div class="recibo-header"><h3>RECIBO: ${rec.mes.toUpperCase()}</h3><p>${rec.fecha}</p></div>
                    <table class="recibo-table">${filas}<tr class="item-total"><td>TOTAL</td><td style="text-align:right">$ ${rec.total.toLocaleString('es-AR')}</td></tr></table>
                </div>`;
        });
        document.getElementById('modalHistorial').style.display = "block";
    }

    function borrarRegistro(id) {
        if (!confirm("¿Eliminar este registro?")) return;
        let historial = JSON.parse(localStorage.getItem('historial_completo') || '[]');
        historial = historial.filter(r => r.id !== id);
        localStorage.setItem('historial_completo', JSON.stringify(historial));
        mostrarHistorial();
    }

    function cerrarHistorial() { document.getElementById('modalHistorial').style.display = "none"; }
</script>
</body>
</html>
